<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CiviHub | Login</title>
<style>
:root{--navy:#0b1426;--panel:#101a2e;--line:#26334d;--yellow:#ffc21a;--muted:#a9b4c8}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:grid;place-items:center;padding:20px;font-family:"Segoe UI",Roboto,Arial,sans-serif;color:#fff;
  background:linear-gradient(rgba(11,20,38,.88),rgba(11,20,38,.92)),url("hero.jpg") center/cover no-repeat,linear-gradient(135deg,#1c2b4d,#3a2f55 60%,#c0623a)}
.card{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:32px 28px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.logo{display:flex;align-items:center;gap:10px;justify-content:center;font-weight:800;font-size:2rem}
.logo span{color:var(--yellow)}
.logo svg{width:44px;height:44px}
.sub{text-align:center;color:var(--muted);font-size:.9rem;margin:4px 0 24px}
h1{font-size:1.3rem;margin-bottom:16px;text-align:center}
label{display:block;font-size:.85rem;margin:14px 0 6px;color:var(--muted)}
input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:#0d1626;color:#fff;font-size:1rem}
input:focus{outline:3px solid var(--yellow);outline-offset:1px}
button{width:100%;margin-top:22px;padding:13px;border:0;border-radius:10px;background:var(--yellow);color:#111;font-weight:800;font-size:1rem;cursor:pointer}
button:hover{filter:brightness(1.08)}
#msg{margin-top:14px;text-align:center;font-size:.9rem;color:var(--yellow);min-height:1.2em}
</style>
</head>
<body>
<main class="card">
  <div class="logo">
    <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M6 58V26L32 6l26 20v32H46V32L32 20 18 32v26z" fill="#ffc21a"/><rect x="26" y="40" width="12" height="18" fill="#ffc21a"/></svg>
    <div>Civi<span>Hub</span></div>
  </div>
  <p class="sub">Build Smarter. Together.</p>
  <h1>Log in</h1>
  <form id="f">
    <label for="u">Email or username</label>
    <input id="u" type="text" autocomplete="username" required>
    <label for="p">Password</label>
    <input id="p" type="password" autocomplete="current-password" required>
    <button type="submit">Log in</button>
    <p id="msg" role="status"></p>
  </form>
</main>
<script>
  document.getElementById('f').addEventListener('submit', function(e){
    e.preventDefault();
    document.getElementById('msg').textContent = 'Login system is not connected yet.';
  });
</script>
</body>
</html>
